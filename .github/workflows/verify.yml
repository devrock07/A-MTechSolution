name: Verify website

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check source, build behavior, and browsers
        run: npm run verify
      - name: Audit test dependencies
        run: npm audit --audit-level=high
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
            qa-artifacts/*-home-*.png
            qa-artifacts/*-contact-*.png
            qa-artifacts/*-solutions-*.png
          retention-days: 7
